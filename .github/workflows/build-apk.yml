name: Build Android APK

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Configure Android SDK and Fix Line Endings
        working-directory: ./frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Copy Web Assets to Android
        working-directory: ./frontend
        run: |
          mkdir -p ./android/app/src/main/assets/public
          cp -r dist/* ./android/app/src/main/assets/public/
          cp capacitor.config.json ./android/app/src/main/assets/
          echo "Web assets copied successfully into Android app assets."

      - name: Build Debug APK with Gradle
        working-directory: ./frontend/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Output Summary
        if: always()
        run: |
          echo "### Gradle Build Output (Last 100 Lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 frontend/android/gradle-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -B debug-log
          cp frontend/android/gradle-build.log build-failure.txt
          git add build-failure.txt
          git commit -m "build failure log" || true
          git push -f origin debug-log || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatFlow-Android-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
