name: Build Android APK

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Configure Android SDK and Fix Line Endings
        working-directory: ./frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Copy Web Assets to Android
        working-directory: ./frontend
        run: |
          mkdir -p ./android/app/src/main/assets/public
          cp -r dist/* ./android/app/src/main/assets/public/
          cp capacitor.config.json ./android/app/src/main/assets/
          echo "Web assets copied successfully into Android app assets."

      - name: Build Debug APK with Gradle
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatFlow-Android-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
